spring:
  application:
    name: nanosweb-ferreteria

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:nanosweb-ferreteria-secret-key-must-be-at-least-256-bits-long-for-hs256}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

# App Configuration
app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  whatsapp-number: ${WHATSAPP_NUMBER:5492615414663}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  catalog-pdf-path: ${CATALOG_PDF_PATH:./uploads/catalogo.pdf}
