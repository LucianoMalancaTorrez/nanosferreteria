spring:
  datasource:
    url: jdbc:mysql://localhost:3306/nanosweb_ferreteria?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Argentina/Buenos_Aires&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

logging:
  level:
    com.nanosweb.ferreteria: DEBUG
    org.springframework.security: DEBUG
